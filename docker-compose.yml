services:
  roundcubemail:
    image: roundcube/roundcubemail:latest
    container_name: roundcubemail
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "for i in {1..5}; do getent hosts mail.infomaniak.com && exit 0 || sleep 2; done; exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - roundcube_infomaniak_www:/var/www/html
      - roundcube_infomaniak_db:/var/roundcube/db
    ports:
      - 127.0.0.1:9002:80
    environment:
      - ROUNDCUBEMAIL_DB_TYPE=sqlite
      #- ROUNDCUBEMAIL_SKIN=larry
      - ROUNDCUBEMAIL_DEFAULT_HOST=ssl://mail.infomaniak.com
      - ROUNDCUBEMAIL_DEFAULT_PORT=993
      - ROUNDCUBEMAIL_SMTP_SERVER=tls://mail.infomaniak.com
      - ROUNDCUBEMAIL_UPLOAD_MAX_FILESIZE=50M
      - ROUNDCUBEMAIL_PLUGINS=contextmenu
      - ROUNDCUBEMAIL_COMPOSER_PLUGINS=johndoh/contextmenu
    # home router DNS answers slowly (~4s per lookup), and roundcube resolves
    # the IMAP host on every request
    dns:
      - 9.9.9.9
      - 1.1.1.1
volumes:
  roundcube_infomaniak_db:
  roundcube_infomaniak_www:
